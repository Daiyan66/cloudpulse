name: CD Pipeline — Deploy to Production

on:
  push:
    branches: [main]
    # Only trigger CD if CI passes (handled by job dependency)

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudpulse-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudpulse-frontend

jobs:
  # ─── Build & Push Docker Images ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Render ─────────────────────────────────────────────────────────
  # Render automatically redeploys when you push to the connected branch.
  # The step below manually triggers a Render deploy hook (optional).
  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger backend deploy hook
        run: |
          curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" || echo "No deploy hook configured"

      - name: Trigger frontend deploy hook
        run: |
          curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" || echo "No deploy hook configured"

      - name: Deployment summary
        run: |
          echo "✅ Deployed CloudPulse to production"
          echo "Backend image: ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_short }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_short }}"

  # ─── Post-Deploy Smoke Test ─────────────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-render
    if: github.ref == 'refs/heads/main' && always()

    steps:
      - name: Verify health endpoint
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "ℹ️ PRODUCTION_URL secret not set. Skipping live HTTP smoke test."
            exit 0
          fi

          echo "🔍 Running smoke test against $PROD_URL/health..."
          for i in {1..10}; do
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$PROD_URL/health" || true)
            STATUS_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "Attempt $i: HTTP Status $STATUS_CODE"
            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Health check passed: $BODY"
              exit 0
            fi

            echo "⏳ Waiting 15s for deployment convergence..."
            sleep 15
          done

          echo "❌ Smoke test failed: Deployment did not become healthy within timeout"
          exit 1
