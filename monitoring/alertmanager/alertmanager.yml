global:
  resolve_timeout: 5m

# ─── Alert Routing ───────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  routes:
    # Critical alerts route immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

# ─── Inhibition Rules ─────────────────────────────────────────────────────────
inhibit_rules:
  # If a service is completely down, silence latency / error rate warnings for it
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']

# ─── Receivers ───────────────────────────────────────────────────────────────
receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://backend:5000/api/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://backend:5000/api/alerts/webhook'
        send_resolved: true
