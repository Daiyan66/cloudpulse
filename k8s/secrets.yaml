apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secrets
  namespace: cloudpulse
type: Opaque
stringData:
  # Replace with base64/real values when applying to cluster
  MONGODB_URI: "mongodb+srv://user:password@cluster.mongodb.net/cloudpulse?retryWrites=true&w=majority"
  JWT_SECRET: "generate_a_secure_jwt_secret_key_minimum_32_characters"
  GRAFANA_ADMIN_PASSWORD: "secure_admin_password_here"
